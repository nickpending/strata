# The world's values: Schwartz's ten basic values, defining goals paraphrased from Schwartz, S. H.
# (2012), An Overview of the Schwartz Theory of Basic Values, Online Readings in Psychology and
# Culture 2(1). Every person file rates each one with an integer from 0 to 4, read by [importance].

[importance]
0 = "does not matter to this person"
1 = "matters a little"
2 = "matters"
3 = "matters a lot"
4 = "central to who this person is"

[[values]]
id = "self_direction"
description = "independent thought and action: choosing your own course, creating, exploring"

[[values]]
id = "stimulation"
description = "excitement, novelty and challenge in life"

[[values]]
id = "hedonism"
description = "pleasure and enjoyment for yourself"

[[values]]
id = "achievement"
description = "personal success through showing competence by the standards of those around you"

[[values]]
id = "power"
description = "status and prestige, control or dominance over people and resources"

[[values]]
id = "security"
description = "safety, harmony and stability of your society, your relationships and yourself"

[[values]]
id = "conformity"
description = "restraint of actions and impulses likely to upset or harm others or break social expectations"

[[values]]
id = "tradition"
description = "respect for and commitment to the customs and ideas your culture or faith provides"

[[values]]
id = "benevolence"
description = "preserving and enhancing the welfare of the people close to you"

[[values]]
id = "universalism"
description = "understanding, tolerance and protection for the welfare of all people and of nature"
